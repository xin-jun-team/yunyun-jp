<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cut">
<meta name="robots" content="noindex, nofollow">
<title>云云代購｜管理後台</title>
<style>
:root{
  --adm-ink:#2b1d24;--adm-sub:#5e4a54;--adm-pink:#b45a8a;--adm-pink-d:#8f3f6b;--adm-pink-l:#f6dfe9;
  --adm-bg:#f8eff3;--adm-card:#ffffff;--adm-line:#ead6df;--adm-side:#2b1d24;--adm-gold:#f3d9a4;
  --adm-r:16px;--adm-gap:20px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--adm-bg);color:var(--adm-ink);font:15px/1.65 "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--adm-pink-d)}
.adm-hide{display:none !important}

/* ---------- login ---------- */
.adm-login{min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--adm-side)}
.adm-login-card{width:min(400px,100%);background:#fff;border-radius:24px;padding:40px 32px 34px;text-align:center}
.adm-logo{width:230px;max-width:100%;height:auto;margin:0 auto 18px;display:block}
.adm-login h1{margin:0 0 4px;font-size:22px}
.adm-login p{margin:0 0 24px;color:var(--adm-sub)}
.adm-login input{width:100%;padding:14px 16px;border:2px solid var(--adm-line);border-radius:12px;margin-bottom:14px;font-size:16px}
.adm-login input:focus{outline:none;border-color:var(--adm-pink)}
.adm-err{color:#b42318;min-height:1.6em;margin:4px 0 0;font-size:14px}

/* ---------- shell ---------- */
.adm-shell{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
.adm-side{background:var(--adm-side);color:#fff;padding:26px 16px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px}
.adm-brand{display:flex;align-items:center;gap:12px;padding:0 8px 22px;margin-bottom:8px;border-bottom:1px solid #4a3640}
.adm-mark{width:42px;height:42px;border-radius:50%;background:var(--adm-pink);color:#fff;display:grid;place-items:center;font-weight:700;font-size:19px;flex:none}
.adm-brand b{display:block;font-size:16px;color:#fff}
.adm-brand small{color:var(--adm-gold);font-size:12px}
.adm-nav a{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;color:#f4e8ee;text-decoration:none;font-weight:500;position:relative}
.adm-nav a svg{width:20px;height:20px;flex:none}
.adm-nav a:hover{background:#3d2a34}
.adm-nav a.on{background:var(--adm-pink);color:#fff}
.adm-badge{margin-left:auto;background:var(--adm-gold);color:#3a2610;font-size:12px;font-weight:700;border-radius:999px;padding:1px 8px;min-width:22px;text-align:center}
.adm-side-foot{margin-top:auto;display:flex;flex-direction:column;gap:6px;padding-top:16px;border-top:1px solid #4a3640}
.adm-side-foot a{color:#f4e8ee;text-decoration:none;padding:8px 14px;border-radius:10px;font-size:14px}
.adm-side-foot a:hover{background:#3d2a34}
.adm-main{padding:34px clamp(16px,3vw,44px) 80px;min-width:0}
.adm-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:26px}
.adm-head h2{margin:0;font-size:28px;letter-spacing:.02em}
.adm-head p{margin:4px 0 0;color:var(--adm-sub)}
.adm-tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* ---------- controls ---------- */
.adm-btn{border:0;border-radius:12px;padding:11px 20px;background:var(--adm-pink);color:#fff;font-weight:700;cursor:pointer;white-space:nowrap}
.adm-btn:hover{background:var(--adm-pink-d)}
.adm-btn:disabled{opacity:.6;cursor:wait}
.adm-btn.ghost{background:#fff;color:var(--adm-pink-d);box-shadow:inset 0 0 0 2px var(--adm-pink-l)}
.adm-btn.ghost:hover{box-shadow:inset 0 0 0 2px var(--adm-pink)}
.adm-btn.danger{background:#fff;color:#b42318;box-shadow:inset 0 0 0 2px #f5c2bd}
.adm-btn.sm{padding:7px 14px;font-size:14px;border-radius:10px}
.adm-btn.block{width:100%;padding:14px}
.adm-in{padding:10px 14px;border:2px solid var(--adm-line);border-radius:12px;background:#fff;min-width:0}
.adm-in:focus{outline:none;border-color:var(--adm-pink)}
.adm-search{width:min(320px,100%)}
.adm-chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.adm-chip{border:0;border-radius:999px;padding:8px 16px;background:#fff;color:var(--adm-sub);font-weight:500;cursor:pointer;box-shadow:inset 0 0 0 1.5px var(--adm-line)}
.adm-chip b{font-weight:700;margin-left:4px;color:var(--adm-ink)}
.adm-chip.on{background:var(--adm-ink);color:#fff;box-shadow:none}
.adm-chip.on b{color:var(--adm-gold)}
.adm-sw{position:relative;width:46px;height:26px;flex:none;display:inline-block}
.adm-sw input{opacity:0;width:0;height:0;position:absolute}
.adm-sw span{position:absolute;inset:0;border-radius:99px;background:#d8c6ce;cursor:pointer;transition:.2s}
.adm-sw span:before{content:"";position:absolute;width:20px;height:20px;left:3px;top:3px;border-radius:50%;background:#fff;transition:.2s}
.adm-sw input:checked+span{background:#2f855a}
.adm-sw input:checked+span:before{transform:translateX(20px)}

/* ---------- overview ---------- */
.adm-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:var(--adm-gap);margin-bottom:34px}
.adm-kpi{padding:4px 0 4px 18px;border-left:4px solid var(--adm-pink)}
.adm-kpi small{display:block;color:var(--adm-sub);font-size:14px}
.adm-kpi b{display:block;font-size:30px;line-height:1.25;margin:4px 0 2px;font-variant-numeric:tabular-nums}
.adm-kpi span{font-size:13px;color:var(--adm-sub)}
.adm-kpi.alert{border-color:#c4870f}.adm-kpi.blue{border-color:#2b6cb0}.adm-kpi.green{border-color:#2f855a}
.adm-grid2{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:28px;margin-bottom:28px}
.adm-grid2>*{min-width:0}
.adm-panel{background:var(--adm-card);border-radius:var(--adm-r);padding:26px 26px 22px}
.adm-panel h3{margin:0 0 18px;font-size:17px;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:4px 8px}
.adm-panel h3 small{font-weight:400;color:var(--adm-sub);font-size:13px}
.adm-bars{display:flex;align-items:flex-end;gap:6px;height:180px;padding-top:24px}
.adm-bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px;min-width:0;position:relative}
.adm-bar i{display:block;width:100%;max-width:30px;background:var(--adm-pink);border-radius:6px 6px 2px 2px;min-height:2px}
.adm-bar.today i{background:var(--adm-pink-d)}
.adm-bar em{font-style:normal;font-size:11px;color:var(--adm-sub);white-space:nowrap}
@media (max-width:520px){.adm-bars{gap:3px}.adm-bar em{font-size:9px;letter-spacing:-.3px}.adm-bar:nth-child(even) em{visibility:hidden}}
.adm-bar u{text-decoration:none;font-size:11px;font-weight:700;position:absolute;top:-2px;color:var(--adm-ink)}
.adm-hbar{display:grid;grid-template-columns:minmax(120px,auto) 1fr auto;gap:12px;align-items:center;margin-bottom:12px;font-size:14px}
.adm-hbar div{height:12px;background:var(--adm-pink-l);border-radius:99px;overflow:hidden}
.adm-hbar div i{display:block;height:100%;background:var(--adm-pink);border-radius:99px}
.adm-hbar b{font-variant-numeric:tabular-nums}
.adm-list{list-style:none;margin:0;padding:0}
.adm-list li{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px dashed var(--adm-line)}
.adm-list li:last-child{border-bottom:0}
.adm-empty{color:var(--adm-sub);padding:18px 0;text-align:center}
.adm-list li.adm-empty{display:block}
.adm-hbar span{white-space:nowrap}

/* ---------- status pill ---------- */
.adm-st{display:inline-block;font-size:13px;font-weight:700;padding:3px 12px;border-radius:999px;white-space:nowrap}
.adm-st[data-s="待付款"]{background:#fdf0d5;color:#7a4b00}
.adm-st[data-s="處理中"]{background:#dbeafe;color:#1e4e8c}
.adm-st[data-s="已出貨"]{background:#ede4fb;color:#55309e}
.adm-st[data-s="已完成"]{background:#d9f2e3;color:#1f6141}
.adm-st[data-s="已取消"]{background:#e9e5e7;color:#4a4246}
.adm-st[data-s="已退費"]{background:#fde2df;color:#a3221a}

/* ---------- tables ---------- */
.adm-table-wrap{background:var(--adm-card);border-radius:var(--adm-r);overflow:auto}
.adm-table{width:100%;border-collapse:collapse;min-width:720px}
.adm-table th{text-align:left;font-size:13px;color:var(--adm-sub);font-weight:700;padding:16px 18px;border-bottom:2px solid var(--adm-line);white-space:nowrap;background:#fff;position:sticky;top:0}
.adm-table td{padding:16px 18px;border-bottom:1px solid #f2e6eb;vertical-align:top}
.adm-table tr:last-child td{border-bottom:0}
.adm-table tr.click{cursor:pointer}
.adm-table tr.click:hover td{background:#fdf6f9}
.adm-num{text-align:right !important;font-variant-numeric:tabular-nums;white-space:nowrap}
.adm-sm{font-size:13px;color:var(--adm-sub)}
.adm-strong{font-weight:700}

/* ---------- orders as cards (mobile) ---------- */
.adm-ocards{display:none}
.adm-ocard{background:#fff;border-radius:var(--adm-r);padding:18px 20px;margin-bottom:14px;cursor:pointer}
.adm-ocard-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
.adm-ocard-items{color:var(--adm-sub);font-size:14px;white-space:pre-line;margin:6px 0 10px}
.adm-ocard-foot{display:flex;justify-content:space-between;gap:10px;font-size:14px}

/* ---------- drawer ---------- */
.adm-drawer{position:fixed;inset:0;z-index:50;display:flex;justify-content:flex-end;background:#1d1217d9}
.adm-drawer-in{width:min(560px,100%);height:100%;overflow:auto;background:#fff;padding:30px 30px 60px}
.adm-drawer h3{margin:0;font-size:22px}
.adm-dl{display:grid;grid-template-columns:96px 1fr;gap:12px 16px;margin:22px 0}
.adm-dl dt{color:var(--adm-sub);font-size:14px}
.adm-dl dd{margin:0;word-break:break-word}
.adm-sec{margin:26px 0 0;padding-top:22px;border-top:2px dashed var(--adm-line)}
.adm-sec h4{margin:0 0 14px;font-size:15px}
.adm-field{display:block;margin-bottom:16px}
.adm-field>span{display:block;font-size:14px;color:var(--adm-sub);margin-bottom:6px}
.adm-field .adm-in{width:100%}
.adm-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.adm-x{border:0;background:var(--adm-bg);width:40px;height:40px;border-radius:50%;font-size:22px;cursor:pointer;line-height:1}
.adm-items{list-style:none;padding:0;margin:0}
.adm-items li{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px dashed var(--adm-line)}

/* ---------- stock ---------- */
.adm-prod{background:#fff;border-radius:var(--adm-r);padding:20px 22px;margin-bottom:16px}
.adm-prod-h{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:6px}
.adm-prod-h b{font-size:16px}
.adm-var{display:grid;grid-template-columns:1fr 110px 110px 70px 64px;gap:14px;align-items:center;padding:12px 0;border-top:1px solid #f2e6eb}
.adm-var .adm-in{width:100%;padding:8px 10px;text-align:right}
.adm-var.changed{background:#fff8e6;margin:0 -12px;padding:12px;border-radius:10px}
.adm-var.out .adm-vname{color:#a3221a}
.adm-var-h{border-top:0;font-size:12px;color:var(--adm-sub);padding:4px 0}
.adm-savebar{position:sticky;bottom:16px;z-index:5;display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--adm-ink);color:#fff;border-radius:14px;padding:12px 14px 12px 22px;margin-top:10px}

/* ---------- coupons / messages ---------- */
.adm-cform{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 16px;align-items:end}
.adm-cform .wide{grid-column:span 2}
.adm-msg{background:#fff;border-radius:var(--adm-r);padding:20px 24px;margin-bottom:14px}
.adm-msg.done{opacity:.62}
.adm-msg p{white-space:pre-wrap;margin:10px 0 14px}
.adm-note{background:#fff4d6;color:#5c3d00;border-radius:12px;padding:14px 18px;margin-bottom:22px}

.adm-toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--adm-ink);color:#fff;padding:12px 22px;border-radius:12px;z-index:99;box-shadow:0 10px 30px #0004;max-width:90vw}
.adm-toast.err{background:#a3221a}
.adm-loading{padding:60px 0;text-align:center;color:var(--adm-sub)}

.adm-pitem{display:flex;align-items:center;gap:14px;min-width:220px}
.adm-pitem img{width:54px;height:54px;border-radius:10px;object-fit:cover;background:#f4f4f4;flex:none}
.adm-pitem a{color:inherit;text-decoration:none}.adm-pitem a:hover{text-decoration:underline}
.adm-pform .adm-field{margin-bottom:22px}
.adm-pform textarea.adm-in{resize:vertical;line-height:1.7}
.adm-pform .adm-cform{margin-bottom:6px}
.adm-imgs{display:flex;flex-wrap:wrap;gap:14px;margin-top:6px}
.adm-img{position:relative;width:132px;height:132px;border-radius:14px;overflow:hidden;background:#f4f4f4;border:1px solid var(--adm-line)}
.adm-img img{width:100%;height:100%;object-fit:cover;display:block}
.adm-img-main{position:absolute;left:8px;top:8px;background:var(--adm-ink);color:#fff;font-size:12px;padding:3px 9px;border-radius:99px}
.adm-img-tools{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;padding:6px;background:#1d1d1fcc}
.adm-img-tools button{border:0;background:#fff;color:#1d1d1f;width:30px;height:30px;border-radius:8px;cursor:pointer;font-size:14px;line-height:1}
.adm-img-tools button:disabled{opacity:.35;cursor:default}
.adm-img.up{display:grid;place-items:center;color:#555;font-size:13px}
.adm-img.add{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer;border:2px dashed #c9c9cf;background:#fff;color:#555}
.adm-img.add b{font-size:30px;font-weight:400;line-height:1}
.adm-img.add:hover{border-color:var(--adm-pink);color:var(--adm-ink)}
.adm-img.add input{display:none}
.adm-pvars{background:#fafafa;border-radius:14px;padding:18px 18px 16px;margin:6px 0 24px}
.adm-pvrow{display:grid;grid-template-columns:2fr 1fr 1fr 1.6fr 40px;gap:10px;align-items:center;margin-bottom:10px}
.adm-pvimg{display:flex;align-items:center;gap:8px;min-width:0}
.adm-pvimg img{width:40px;height:40px;border-radius:8px;object-fit:cover;background:#f4f4f4;flex:none}
.adm-pvimg select{min-width:0;flex:1}
.adm-ups{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:8px}
.adm-up{display:inline-flex;align-items:center;gap:8px;background:#fafafa;border:1px solid var(--adm-line);border-radius:999px;padding:5px 6px 5px 6px;font-size:14px;line-height:1.4}
.adm-up img{width:30px;height:30px;border-radius:50%;object-fit:cover}
.adm-up button{border:0;background:none;color:#a3221a;cursor:pointer;font-size:15px;padding:0 6px}
.adm-ups select{max-width:380px}
.adm-prod-h .adm-row{gap:10px}
.adm-pvrow.h{font-size:13px;color:#555;margin-bottom:8px}
.adm-pvrow button{border:0;background:none;font-size:18px;cursor:pointer;color:#a3221a;height:40px}
.adm-pcats{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px 18px;margin-top:8px}
.adm-pcats label{display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer;line-height:1.4}
.adm-pcats label.sub{padding-left:22px}
.adm-pcats input{width:17px;height:17px;accent-color:var(--adm-ink);flex:none}
.adm-mails{display:grid;grid-template-columns:minmax(220px,320px) 1fr;gap:20px;align-items:start}
.adm-mail-l{display:flex;flex-direction:column;gap:8px}
.adm-mail{display:block;text-align:left;border:1px solid var(--adm-line);background:#fff;border-radius:12px;padding:12px 14px;cursor:pointer;font:inherit;color:inherit;line-height:1.5}
.adm-mail.on{border-color:var(--adm-ink);box-shadow:0 0 0 1px var(--adm-ink)}
.adm-mail b{display:block;margin-bottom:4px}
.adm-mail-v iframe{width:100%;height:70vh;border:0;background:#fff;border-radius:12px}
.adm-demo-note{background:#fff4d6;color:#5c3d00;border-radius:12px;padding:12px 16px;margin-top:18px;font-size:14px;line-height:1.7;text-align:left}
.adm-demo-note button{border:0;background:none;color:#5c3d00;text-decoration:underline;cursor:pointer;font:inherit;padding:0}
@media (max-width:760px){.adm-mails{grid-template-columns:1fr}.adm-pvrow{grid-template-columns:1fr 1fr 1fr 34px;gap:6px}.adm-pvrow .adm-pvimg{grid-column:1/4;grid-row:2}.adm-pvrow.h span:nth-child(4){display:none}.adm-img{width:104px;height:104px}}
@media (max-width:980px){
  .adm-grid2{grid-template-columns:minmax(0,1fr)}
  .adm-cform{grid-template-columns:1fr 1fr}
}
@media (max-width:760px){
  .adm-shell{grid-template-columns:1fr}
  .adm-side{position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;flex-direction:row;padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:40;gap:0}
  .adm-brand,.adm-side-foot{display:none}
  .adm-nav{display:flex;width:100%;justify-content:space-around}
  .adm-nav a{flex-direction:column;gap:2px;padding:8px 2px;font-size:11px;flex:1;justify-content:center}
  .adm-badge{position:absolute;top:2px;right:calc(50% - 22px);padding:0 6px;font-size:10px;min-width:18px}
  .adm-main{padding:22px 14px 110px}
  .adm-head h2{font-size:24px}
  .adm-kpi b{font-size:24px}
  .adm-kpis{grid-template-columns:1fr 1fr;gap:18px}
  .adm-panel{padding:20px 18px}
  .adm-soldc::before{content:'已售 '}
  .adm-otable{display:none}
  .adm-ocards{display:block}
  .adm-var{grid-template-columns:1fr 1fr 1fr;gap:10px}
  .adm-var .adm-vname{grid-column:1/-1}
  .adm-var-h{display:none}
  .adm-cform{grid-template-columns:1fr}
  .adm-cform .wide{grid-column:auto}
  .adm-drawer-in{padding:22px 18px 60px}
  .adm-search{width:100%}
  .adm-tools{width:100%}
}

/* ---------- live preview ---------- */
.adm-pv-btn{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#3d2a34;color:#fff;border:0;border-radius:10px;padding:10px 14px;font:inherit;font-size:14px;cursor:pointer;margin-bottom:6px}
.adm-pv-btn i{font-style:normal;font-size:12px;background:#5a4450;padding:2px 10px;border-radius:99px}
.adm-pv-btn.on i{background:var(--adm-pink);color:#fff}
.adm-pv{position:fixed;top:0;right:0;bottom:0;width:var(--pvw,430px);background:#1d1318;display:flex;flex-direction:column;z-index:30;box-shadow:-10px 0 30px #0003}
.adm-pv-bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:12px 14px;background:#2b1d24;color:#fff}
.adm-pv-bar b{font-size:14px;margin-right:auto}
.adm-pv-bar select,.adm-pv-bar button,.adm-pv-bar a{background:#3d2a34;color:#fff;border:0;border-radius:8px;padding:7px 11px;font:inherit;font-size:13px;cursor:pointer;text-decoration:none}
.adm-pv-bar button.on{background:var(--adm-pink)}
.adm-pv-bar .adm-pv-x{background:#f4e8ee;color:#2b1d24;font-weight:700}
.adm-pv-stage{flex:1;display:flex;justify-content:center;overflow:hidden;background:#1d1318;padding:12px}
.adm-pv-stage iframe{border:0;background:#fff;border-radius:14px;width:100%;height:100%}
.adm-pv.phone .adm-pv-stage iframe{max-width:390px}
body.adm-pv-open .adm-shell{margin-right:var(--pvw,430px)}
body.adm-pv-open .adm-var{grid-template-columns:1fr 1fr auto;gap:10px}
body.adm-pv-open .adm-var .adm-vname{grid-column:1/-1}
body.adm-pv-open .adm-var-h{display:none}
body.adm-pv-open .adm-soldc::before{content:'已售 '}
body.adm-pv-open .adm-otable{display:none}
body.adm-pv-open .adm-ocards{display:block}
body.adm-pv-open .adm-grid2{grid-template-columns:minmax(0,1fr)}
body.adm-pv-open .adm-cform{grid-template-columns:1fr 1fr}
.adm-pv.wide .adm-pv-stage{display:block;padding:12px;position:relative}
.adm-pv.wide .adm-pv-stage iframe{width:1280px;max-width:none;transform-origin:0 0;border-radius:10px}

.adm-pv-fab{display:none}
@media (max-width:1100px){body.adm-pv-open .adm-shell{margin-right:0}.adm-pv{width:100%!important}.adm-pv-wide{display:none}}
@media (max-width:760px){

<script src="../assets/yy-config.js"></script>
<script>
(function () {
  var GAS = (window.YY_CONFIG || {}).gasUrl || '';
  var DEMO = GAS === 'demo';   // 展示模式：後端程式在瀏覽器裡跑，資料存在這台裝置
  var TK = 'yy_admin_token';
  var demoP = null;
  function demoEngine() {
    if (window.YY_DEMO) return Promise.resolve(window.YY_DEMO);
    if (!demoP) demoP = new Promise(function (ok, no) {
      window.YY_DEMO_ROOT = new URL('../', location.href).href;
      var sc = document.createElement('script'); sc.src = '../assets/yy-demo.js';
      sc.onload = function () { window.YY_DEMO ? ok(window.YY_DEMO) : no(new Error('展示模式載入失敗，請重新整理')); };
      sc.onerror = function () { demoP = null; no(new Error('展示模式載入失敗，請重新整理')); };
      document.head.appendChild(sc);
    });
    return demoP;
  }
  function transport(data) {
    if (DEMO) return demoEngine().then(function (E) { return new Promise(function (ok) { setTimeout(function () { ok(JSON.stringify(E.post(data))); }, 120); }); });
    return fetch(GAS, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(data) })
      .then(function (r) { return r.text(); }, function () { throw new Error('網路連線失敗'); });
  }
  var $ = function (s, c) { return (c || document).querySelector(s); };
  var $$ = function (s, c) { return Array.prototype.slice.call((c || document).querySelectorAll(s)); };
  var main = $('#admMain');
  var S = { orders: null, statuses: ['待付款', '處理中', '已出貨', '已完成', '已取消', '已退費'], filter: '全部', q: '', stock: null, stockQ: '', stockOnly: '', dirty: {}, sheetUrl: '' };

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function money(n) { return 'NT$' + Math.round(Number(n) || 0).toLocaleString('en-US'); }
  function d2(n) { return n < 10 ? '0' + n : n; }
  function dt(t, withTime) { if (!t) return '—'; var d = new Date(t); var s = d.getFullYear() + '/' + d2(d.getMonth() + 1) + '/' + d2(d.getDate()); return withTime ? s + ' ' + d2(d.getHours()) + ':' + d2(d.getMinutes()) : s; }
  function ago(t) { var m = (Date.now() - t) / 6e4; if (m < 1) return '剛剛'; if (m < 60) return Math.floor(m) + ' 分鐘前'; if (m < 1440) return Math.floor(m / 60) + ' 小時前'; if (m < 43200) return Math.floor(m / 1440) + ' 天前'; return dt(t); }
  function st(s) { return '<span class="adm-st" data-s="' + esc(s) + '">' + esc(s) + '</span>'; }
  function toast(msg, err) { var t = document.createElement('div'); t.className = 'adm-toast' + (err ? ' err' : ''); t.textContent = msg; document.body.appendChild(t); setTimeout(function () { t.remove(); }, err ? 4200 : 2400); }
  function loading() { main.innerHTML = '<div class="adm-loading">載入中…</div>'; }
  function head(title, sub, tools) { return '<div class="adm-head"><div><h2>' + title + '</h2>' + (sub ? '<p>' + sub + '</p>' : '') + '</div><div class="adm-tools">' + (tools || '') + '</div></div>'; }

  function api(action, data) {
    data = data || {}; data.action = action; data.token = localStorage.getItem(TK) || '';
    return transport(data)
      .then(function (t) {
        var j; try { j = JSON.parse(t); } catch (e) { throw new Error('伺服器回應異常'); }
        if (!j.ok) { if (/重新登入|逾時/.test(j.error) && action !== 'admin_login') { localStorage.removeItem(TK); showLogin(); } throw new Error(j.error); }
        if (/^admin_(catalog_update|coupon_save|coupon_delete|settings_save|product_delete|product_status)$/.test(action) && window.__pvRefresh) setTimeout(window.__pvRefresh, 300);
        return j;
      });
  }
  function fail(e) { toast(e.message || '發生錯誤', true); }

  /* ---------- auth ---------- */
  function showLogin() { $('#admLogin').classList.remove('adm-hide'); $('#admShell').classList.add('adm-hide'); }
  function showApp() { $('#admLogin').classList.add('adm-hide'); $('#admShell').classList.remove('adm-hide'); route(); }
  $('#admLoginForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var b = $('button', this), er = $('#admLoginErr'); er.textContent = '';
    if (!GAS) { er.textContent = '尚未連接後台：請先在 assets/yy-config.js 填入 gasUrl。'; return; }
    b.disabled = true; b.textContent = '登入中…';
    api('admin_login', { password: $('#admPass').value }).then(function (j) { localStorage.setItem(TK, j.token); $('#admPass').value = ''; showApp(); })
      .catch(function (x) { er.textContent = x.message; }).then(function () { b.disabled = false; b.textContent = '登入'; });
  });
  $('#admOut').addEventListener('click', function (e) { e.preventDefault(); localStorage.removeItem(TK); showLogin(); });

  /* ---------- router ---------- */
  var VIEWS = { overview: vOverview, orders: vOrders, products: vProducts, stock: vStock, members: vMembers, coupons: vCoupons, messages: vMessages, settings: vSettings };
  if (DEMO) VIEWS.mails = vMails;
  function route() {
    if (!localStorage.getItem(TK)) return showLogin();
    var h = (location.hash || '#overview').slice(1).split('?')[0];
    if (!VIEWS[h]) h = 'overview';
    if (h !== 'stock' && Object.keys(S.dirty).length && !confirm('庫存有修改尚未儲存，確定離開？')) { location.hash = '#stock'; return; }
    if (h !== 'stock') S.dirty = {};
    if (S.pEdit && !confirm('商品還沒儲存，確定離開？')) { history.replaceState(null, '', '#products'); return; }
    S.pEdit = false;
    $$('#admNav a').forEach(function (a) { a.classList.toggle('on', a.dataset.t === h); });
    closeDrawer(); window.scrollTo(0, 0);
    VIEWS[h]();
  }
  window.addEventListener('hashchange', route);
  function badges(o) {
    var b1 = $('#bOrders'), b2 = $('#bMsgs');
    var n = (o.pending || 0) + (o.toShip || 0);
    b1.textContent = n; b1.classList.toggle('adm-hide', !n);
    b2.textContent = o.unread; b2.classList.toggle('adm-hide', !o.unread);
  }

  /* ---------- 總覽 ---------- */
  function vOverview() {
    loading();
    api('admin_overview').then(function (o) {
      badges(o);
      var max = Math.max.apply(null, o.days.map(function (d) { return d.total; }).concat([1]));
      var bars = o.days.map(function (d, i) {
        var dd = new Date(d.d);
        return '<div class="adm-bar' + (i === o.days.length - 1 ? ' today' : '') + '" title="' + dt(d.d) + '：' + d.n + ' 筆 ' + money(d.total) + '">' + (d.n ? '<u style="bottom:' + (d.total / max * 130 + 26) + 'px">' + d.n + '</u>' : '') + '<i style="height:' + (d.total / max * 130) + 'px"></i><em>' + (dd.getMonth() + 1) + '/' + dd.getDate() + '</em></div>';
      }).join('');
      var src = Object.keys(o.sources).map(function (k) { return { k: k, n: o.sources[k].n, t: o.sources[k].total }; }).sort(function (a, b) { return b.n - a.n; });
      var smax = Math.max.apply(null, src.map(function (x) { return x.n; }).concat([1]));
      main.innerHTML = head('總覽', '今天是 ' + dt(Date.now()) + '，' + (o.pending ? '有 <b>' + o.pending + '</b> 筆訂單等待付款確認' : '目前沒有待付款訂單'), '<button class="adm-btn ghost sm" id="rf">重新整理</button>') +
        '<div class="adm-kpis">' +
        '<div class="adm-kpi"><small>今日營收</small><b>' + money(o.today.total) + '</b><span>' + o.today.n + ' 筆訂單</span></div>' +
        '<div class="adm-kpi"><small>本月營收</small><b>' + money(o.month.total) + '</b><span>' + o.month.n + ' 筆訂單</span></div>' +
        '<div class="adm-kpi alert"><small>待付款</small><b>' + o.pending + '</b><span><a href="#orders?s=待付款">查看訂單 →</a></span></div>' +
        '<div class="adm-kpi blue"><small>待出貨（處理中）</small><b>' + o.toShip + '</b><span><a href="#orders?s=處理中">查看訂單 →</a></span></div>' +
        '<div class="adm-kpi green"><small>會員</small><b>' + o.members + '</b><span>近 30 天新增 ' + o.newMembers + ' 位</span></div>' +
        '</div>' +
        '<div class="adm-grid2"><div class="adm-panel"><h3>近 14 天營收 <small>柱高＝金額，上方數字＝訂單數</small></h3><div class="adm-bars">' + bars + '</div></div>' +
        '<div class="adm-panel"><h3>訂單從哪裡來 <small>近 30 天</small></h3>' + (src.length ? src.map(function (x) {
          return '<div class="adm-hbar"><span>' + esc(x.k) + '</span><div><i style="width:' + (x.n / smax * 100) + '%"></i></div><b>' + x.n + ' 筆</b></div>';
        }).join('') : '<div class="adm-empty">還沒有訂單</div>') + '</div></div>' +
        '<div class="adm-grid2"><div class="adm-panel"><h3>最新訂單 <small><a href="#orders">全部訂單 →</a></small></h3><ul class="adm-list">' + (o.recent.length ? o.recent.map(function (r) {
          return '<li><span><b>#' + esc(r.number) + '</b>　' + esc(r.name) + '<br><span class="adm-sm">' + ago(r.date) + '・' + esc(r.source || '直接造訪') + '</span></span><span style="text-align:right">' + money(r.total) + '<br>' + st(r.status) + '</span></li>';
        }).join('') : '<li class="adm-empty">還沒有訂單</li>') + '</ul></div>' +
        '<div class="adm-panel"><h3>庫存快沒了 <small>剩 2 件以下</small></h3><ul class="adm-list">' + (o.low.length ? o.low.map(function (r) {
          return '<li><span>' + esc(r.name) + (r.option ? '<br><span class="adm-sm">' + esc(r.option) + '</span>' : '') + '</span><b style="color:#a3221a;white-space:nowrap">剩 ' + r.qty + '</b></li>';
        }).join('') : '<li class="adm-empty">沒有低庫存商品<br><span class="adm-sm">在「庫存」填入數量，賣完就會自動顯示已售完</span></li>') + '</ul>' +
        (o.top.length ? '<h3 style="margin-top:26px">熱銷商品</h3><ul class="adm-list">' + o.top.map(function (t) { return '<li><span>' + esc(t.name) + '</span><b>' + t.sold + ' 件</b></li>'; }).join('') + '</ul>' : '') +
        '</div></div>';
      $('#rf').onclick = vOverview;
    }).catch(fail);
  }

  /* ---------- 訂單 ---------- */
  function hashParam(k) { var m = location.hash.match(new RegExp('[?&]' + k + '=([^&]*)')); return m ? decodeURIComponent(m[1]) : ''; }
  function vOrders() {
    var s = hashParam('s'), q = hashParam('q');
    if (s) S.filter = s; if (q) S.q = q;
    loading();
    api('admin_orders').then(function (j) { S.orders = j.orders; S.statuses = j.statuses; paintOrders(); }).catch(fail);
  }
  function filtered() {
    var q = S.q.trim().toLowerCase();
    return S.orders.filter(function (o) {
      if (S.filter !== '全部' && o.status !== S.filter) return false;
      if (!q) return true;
      return [o.number, o.name, o.email, o.phone, o.items, o.store, o.address].join(' ').toLowerCase().indexOf(q) >= 0;
    });
  }
  function paintOrders() {
    var cnt = { '全部': S.orders.length }; S.statuses.forEach(function (x) { cnt[x] = 0; }); S.orders.forEach(function (o) { cnt[o.status] = (cnt[o.status] || 0) + 1; });
    main.innerHTML = head('訂單', '共 ' + S.orders.length + ' 筆，點一下訂單可改狀態、通知客人', '<input class="adm-in adm-search" id="oq" placeholder="搜尋 姓名／電話／Email／訂單編號／商品" value="' + esc(S.q) + '"><button class="adm-btn ghost sm" id="csv">匯出 Excel (CSV)</button>') +
      '<div class="adm-chips">' + ['全部'].concat(S.statuses).map(function (x) { return '<button class="adm-chip' + (S.filter === x ? ' on' : '') + '" data-f="' + x + '">' + x + '<b>' + (cnt[x] || 0) + '</b></button>'; }).join('') + '</div>' +
      '<div id="olist"></div>';
    paintOrderList();
    $$('.adm-chip', main).forEach(function (b) { b.onclick = function () { S.filter = b.dataset.f; paintOrders(); }; });
    $('#oq').oninput = function () { S.q = this.value; paintOrderList(); };
    $('#csv').onclick = exportCSV;
  }
  function paintOrderList() {
    var l = filtered(), box = $('#olist');
    if (!l.length) { box.innerHTML = '<div class="adm-panel adm-empty">沒有符合的訂單</div>'; return; }
    box.innerHTML = '<div class="adm-table-wrap adm-otable"><table class="adm-table"><thead><tr><th>訂單</th><th>時間</th><th>客人</th><th>商品</th><th class="adm-num">總計</th><th>運送</th><th>來源</th><th>狀態</th></tr></thead><tbody>' +
      l.map(function (o) {
        return '<tr class="click" data-n="' + esc(o.number) + '"><td class="adm-strong">#' + esc(o.number) + '</td><td class="adm-sm">' + dt(o.date, true) + '</td><td>' + esc(o.name) + '<br><span class="adm-sm">' + esc(o.phone) + '</span>' + (o.account ? '<br><span class="adm-sm">會員</span>' : '') + '</td>' +
          '<td class="adm-sm" style="max-width:260px;white-space:pre-line">' + esc(o.items) + '</td><td class="adm-num adm-strong">' + money(o.total) + '</td><td class="adm-sm">' + esc(o.shipMethod) + (o.store ? '<br>' + esc(o.store) : '') + '</td><td class="adm-sm">' + esc(o.source || '直接造訪') + '<br>' + esc(o.device || '') + '</td><td>' + st(o.status) + '</td></tr>';
      }).join('') + '</tbody></table></div>' +
      '<div class="adm-ocards">' + l.map(function (o) {
        return '<div class="adm-ocard" data-n="' + esc(o.number) + '"><div class="adm-ocard-top"><b>#' + esc(o.number) + '　' + esc(o.name) + '</b>' + st(o.status) + '</div><div class="adm-ocard-items">' + esc(o.items) + '</div><div class="adm-ocard-foot"><span class="adm-sm">' + dt(o.date, true) + '・' + esc(o.source || '直接造訪') + '</span><b>' + money(o.total) + '</b></div></div>';
      }).join('') + '</div>';

      }).join('') + new Array(E.up + 1).join('<div class="adm-img up">上傳中…</div>') +
        (n + E.up < maxN ? '<label class="adm-img add"><input type="file" accept="image/*" multiple><b>＋</b><span>加入圖片</span></label>' : '');
      $$('[data-mv]', $('#pimgs')).forEach(function (b) { b.onclick = function () { var i = +b.dataset.mv, j = i + +b.dataset.d, t = E.imgs[i]; E.imgs[i] = E.imgs[j]; E.imgs[j] = t; S.pEdit = true; paintImgs(); }; });
      $$('[data-rm]', $('#pimgs')).forEach(function (b) { b.onclick = function () { E.imgs.splice(+b.dataset.rm, 1); S.pEdit = true; paintImgs(); }; });
      var fi = $('#pimgs input[type=file]'); if (fi) fi.onchange = function () { addFiles([].slice.call(this.files)); };
      syncVimg();
    }
    function addFiles(files) {
      files = files.slice(0, Math.max(0, maxN - E.imgs.length - E.up));
      if (!files.length) return;
      S.pEdit = true;
      E.up += files.length; paintImgs();
      files.reduce(function (pr, file) {
        return pr.then(function () {
          return shrink(file, DEMO ? [720, 360] : [1400], DEMO ? [.72, .7] : .85)
            .then(function (d) { return api('admin_upload_image', { data: d[0], name: file.name }).then(function (j) { E.imgs.push({ url: j.url, thumb: d[1] || j.url }); }); })
            .catch(fail).then(function () { E.up--; paintImgs(); });
        });
      }, Promise.resolve());
    }

    // 規格（每個規格可以指定一張商品圖，客人選了就切換到那張）
    function imgOpts(cur) {
      var seen = {}, o = '<option value="">不切換圖片</option>';
      E.imgs.forEach(function (x, i) { if (seen[x.url]) return; seen[x.url] = 1; o += '<option value="' + esc(x.url) + '"' + (x.url === cur ? ' selected' : '') + '>第 ' + (i + 1) + ' 張圖</option>'; });
      if (cur && !seen[cur]) o += '<option value="' + esc(cur) + '" selected>原本的規格圖</option>';
      return o;
    }
    function syncVimg() {
      $$('#pvlist .adm-pvrow', f).forEach(function (r) {
        var s = $('[data-k=img]', r), v = s.value; s.innerHTML = imgOpts(v);
        var im = $('.adm-pvimg img', r), u = imgSrc(s.value); if (u) im.src = u; else im.removeAttribute('src'); im.style.visibility = u ? '' : 'hidden';
      });
    }
    function vrow(v) {
      return '<div class="adm-pvrow" data-vid="' + esc(v.id || '') + '" data-q0="' + esc(v.q0) + '"><input class="adm-in" data-k="name" maxlength="60" placeholder="例：01 粉紅" value="' + esc(v.name) + '">' +
        '<input class="adm-in" data-k="price" type="number" min="0" step="1" inputmode="numeric" value="' + esc(v.price) + '">' +
        '<input class="adm-in" data-k="qty" type="number" min="0" step="1" inputmode="numeric" placeholder="不限" value="' + esc(v.q0) + '">' +
        '<span class="adm-pvimg"><img alt=""><select class="adm-in" data-k="img" aria-label="規格圖片">' + imgOpts(v.img || '') + '</select></span>' +
        '<button type="button" data-vx aria-label="刪除這個規格">✕</button></div>';
    }
    function bindVx() {
      $$('[data-vx]', f).forEach(function (b) { b.onclick = function () { b.parentNode.remove(); S.pEdit = true; }; });
      $$('#pvlist [data-k=img]', f).forEach(function (s) { s.onchange = syncVimg; });
      syncVimg();
    }
    $('#pvlist').innerHTML = p.vars.map(function (v) { return vrow({ id: v.id, name: v.name, price: v.price, img: v.img, q0: v.qty === null || v.qty === undefined ? '' : String(v.qty) }); }).join('');
    $('#pvadd').onclick = function () { $('#pvlist').insertAdjacentHTML('beforeend', vrow({ name: '', price: '', q0: '' })); bindVx(); S.pEdit = true; $('#pvlist .adm-pvrow:last-child input').focus(); };
    function syncVars() {
      var on = el.hasVars.checked;
      $('#pvars').classList.toggle('adm-hide', !on); $('#pqty').classList.toggle('adm-hide', on);
      if (on && !$('#pvlist .adm-pvrow')) $('#pvlist').innerHTML = vrow({ name: '', price: '', q0: '' }) + vrow({ name: '', price: '', q0: '' });
      bindVx();
    }
    el.hasVars.onchange = syncVars;
    paintImgs(); syncVars();

    // 推薦商品
    function paintUps() {
      var by = {}; allProds().forEach(function (x) { if (x.state !== 'del') by[x.id] = x; });
      E.ups = E.ups.filter(function (u) { return by[u] && u !== p.id; });
      $('#pups').innerHTML = E.ups.map(function (u) { var x = by[u], th = imgSrc(x.thumb); return '<span class="adm-up">' + (th ? '<img src="' + esc(th) + '" alt="">' : '') + esc(x.name) + (x.state === 'on' ? '' : '<span class="adm-sm">（已下架）</span>') + '<button type="button" data-ux="' + esc(u) + '" aria-label="移除">✕</button></span>'; }).join('') +
        (E.ups.length < 12 ? '<select class="adm-in" id="pupadd"><option value="">＋ 加入推薦商品…</option>' + Object.keys(by).filter(function (k) { return k !== p.id && E.ups.indexOf(k) < 0; }).map(function (k) { return '<option value="' + esc(k) + '">' + esc(by[k].name) + '</option>'; }).join('') + '</select>' : '');
      $$('[data-ux]', $('#pups')).forEach(function (b) { b.onclick = function () { E.ups.splice(E.ups.indexOf(b.dataset.ux), 1); S.pEdit = true; paintUps(); }; });
      var sel = $('#pupadd'); if (sel) sel.onchange = function () { if (sel.value) { E.ups.push(sel.value); S.pEdit = true; paintUps(); } };
    }
    paintUps();

    // 分類
    siteData().then(function (D) {
      var C = D.cats || {}, out = [];
      (function walk(par, depth) {
        Object.keys(C).filter(function (k) { return +C[k].parent === par; }).forEach(function (k) {
          out.push('<label' + (depth ? ' class="sub"' : '') + ' style="' + (depth > 1 ? 'padding-left:' + depth * 22 + 'px' : '') + '"><input type="checkbox" name="cat" value="' + esc(k) + '"' + (p.cats.indexOf(+k) >= 0 ? ' checked' : '') + '>' + esc(C[k].name) + '</label>');
          if (depth < 4) walk(+k, depth + 1);
        });
      })(0, 0);
      $('#pcats').innerHTML = out.join('') || '（沒有分類）';
    }).catch(function (x) { $('#pcats').textContent = x.message; });

    f.onsubmit = function (ev) {
      ev.preventDefault();
      if (E.up) return toast('圖片還在上傳，請稍等一下', true);
      var name = el.pname.value.trim();
      if (!name) { el.pname.focus(); return toast('請填寫商品名稱', true); }
      if (!/^\d+$/.test(el.price.value)) { el.price.focus(); return toast('售價請填 0 以上的整數', true); }
      if (el.was.value !== '' && !/^\d+$/.test(el.was.value)) { el.was.focus(); return toast('原價請填整數，或留空', true); }
      if (el.was.value !== '' && +el.was.value <= +el.price.value) { el.was.focus(); return toast('原價要比售價高才會顯示特價，不需要就留空', true); }
      if (!E.imgs.length) return toast('請至少上傳一張商品圖片', true);
      var imgs = E.imgs.map(function (x) { return x.url; });
      var prod = {
        id: p.id || undefined, name: name, price: +el.price.value, was: el.was.value === '' ? '' : +el.was.value,
        cats: $$('input[name=cat]:checked', f).map(function (c) { return +c.value; }),
        imgs: imgs, thumb: E.imgs[0].thumb !== E.imgs[0].url ? E.imgs[0].thumb : '',
        short: el.short.value, desc: el.desc.value, published: el.published.checked, sku: el.sku.value.trim(), ups: E.ups.slice()
      };
      if (p.orig) {
        // 原網站商品：圖片／介紹沒動就沿用原網站的排版（含原本的圖片尺寸與介紹格式）
        prod.orig = true;
        prod.keepImgs = JSON.stringify(imgs) === JSON.stringify(e.o.imgs);
        prod.keepDesc = el.desc.value.replace(/\r/g, '').trim() === String(e.o.desc || '').trim();
      }
      if (el.hasVars.checked) {
        var rows = $$('#pvlist .adm-pvrow'), bad = '';
        prod.optName = el.optName.value.trim() || '款式';
        prod.vars = rows.map(function (r) {
          var g = function (k) { return $('[data-k=' + k + ']', r).value.trim(); }, v = { id: r.dataset.vid || undefined, name: g('name'), price: g('price'), img: g('img') };
          if (!v.name) bad = bad || '每個規格都要填名稱';
          if (v.price !== '' && !/^\d+$/.test(v.price)) bad = bad || '規格「' + v.name + '」的價格請填整數'; else if (v.price !== '') v.price = +v.price;
          var qv = g('qty');
          if (qv !== '' && !/^\d+$/.test(qv)) bad = bad || '規格「' + v.name + '」的庫存請填整數';
          if (!v.id || qv !== r.dataset.q0) v.qty = qv === '' ? '' : +qv;   // 沒改庫存就不送，避免蓋掉這段時間賣掉的數量
          return v;
        });
        if (!rows.length) bad = '請至少新增一個規格，或關掉「多種規格」';
        if (bad) return toast(bad, true);
      } else {
        var qv = el.qty.value.trim();
        if (qv !== '' && !/^\d+$/.test(qv)) { el.qty.focus(); return toast('庫存數量請填整數，或留空＝不限量', true); }
        if (isNew || qv !== q0 || p.vars.length) prod.qty = qv === '' ? '' : +qv;
      }
      var b = $('button[type=submit]', f); b.disabled = true; b.textContent = '儲存中…';
      api('admin_product_save', { product: prod }).then(function (j) {
        S.pEdit = false;
        return loadProds().then(function () {
          paintProducts();
          toast(j.product.published ? (isNew ? '商品頁已產生，商店和庫存都看得到了' : '已儲存，網站已更新') : '已儲存（未上架，客人看不到）');
          var x = allProds().filter(function (y) { return y.id === j.id; })[0];
          if (j.product.published && x) pvShow(x.url, innerWidth > 1100); else pvRefresh();
        });
      }).catch(function (x) { b.disabled = false; b.textContent = isNew ? '儲存並產生商品頁' : '儲存'; fail(x); });
    };
  }

  /* ---------- 展示信箱（展示模式不會真的寄信） ---------- */
  function vMails() {
    loading();
    demoEngine().then(function (E) {
      var l = E.mails();
      main.innerHTML = head('展示信箱', '展示模式不會真的寄信；網站寄出的信（新訂單通知、出貨通知、忘記密碼…）都會出現在這裡') +
        (l.length ? '<div class="adm-mails"><div class="adm-mail-l">' + l.map(function (m, i) {
          return '<button type="button" class="adm-mail" data-m="' + i + '"><b>' + esc(m.subject) + '</b><span class="adm-sm">寄給 ' + esc(m.to) + '・' + ago(m.t) + '</span></button>';
        }).join('') + '</div><div class="adm-mail-v" id="mv"></div></div>' : '<div class="adm-panel adm-empty">還沒有信件。到網站下一張訂單或按「忘記密碼」試試看</div>');
      function show(i) {
        $$('.adm-mail').forEach(function (b) { b.classList.toggle('on', +b.dataset.m === i); });
        var fr = document.createElement('iframe');
        fr.setAttribute('sandbox', 'allow-popups allow-popups-to-escape-sandbox');
        fr.setAttribute('title', '信件內容');
        fr.srcdoc = '<base target="_blank">' + String(l[i].html || '');
        var v = $('#mv'); v.innerHTML = ''; v.appendChild(fr);
      }
      $$('.adm-mail').forEach(function (b) { b.onclick = function () { show(+b.dataset.m); }; });
      if (l.length) show(0);
    }).catch(fail);
  }
  function demoReset() {
    if (!confirm('確定清除所有展示資料？訂單、會員、新增的商品都會刪掉，密碼回到 demo1234。')) return;
    demoEngine().then(function (E) {
      E.reset(); localStorage.removeItem(TK);
      try { sessionStorage.removeItem('yy_stock_v2'); } catch (e) { }
      location.hash = ''; location.reload();
    }).catch(fail);
  }

  /* ---------- live preview (site in a side panel) ---------- */
  var PV = 'yy_admin_preview', pv = $('#admPv'), pvF = $('#admPvFrame');
  var pvS = (function () { try { return JSON.parse(localStorage.getItem(PV)) || {}; } catch (e) { return {}; } })();
  function pvSave() { localStorage.setItem(PV, JSON.stringify(pvS)); }
  function pvUrl() { return '../' + (pvS.page || ''); }
  function pvPaint() {
    var open = !!pvS.open && !$('#admShell').classList.contains('adm-hide');
    pv.classList.toggle('adm-hide', !open);
    document.body.classList.toggle('adm-pv-open', open);
    var wide = pvS.mode === 'wide' && innerWidth > 1100;
    pv.classList.toggle('phone', !wide);
    pv.classList.toggle('wide', wide);
    document.body.style.setProperty('--pvw', wide ? '44vw' : '430px');
    pvFit();
    $$('.adm-pv-mode').forEach(function (b) { b.classList.toggle('on', b.dataset.m === (wide ? 'wide' : 'phone')); });
    var btn = $('#admPvBtn'); btn.classList.toggle('on', open); $('i', btn).textContent = open ? '開' : '關';
    $('#admPvFab').classList.toggle('adm-hide', open || $('#admShell').classList.contains('adm-hide'));
    var ps = $('#admPvPage'), po = $('option[data-np]', ps);
    if (/^p\/\?id=\d+$/.test(pvS.page || '')) { if (!po) { po = document.createElement('option'); po.setAttribute('data-np', ''); ps.appendChild(po); } po.value = pvS.page; po.textContent = '新增的商品頁'; }
    else if (po) po.remove();
    if (pvS.page && !/^(shop|cart-2|checkout-2|my-account)\/$|^p\/\?id=\d+$/.test(pvS.page)) pvS.page = '';
    ps.value = pvS.page || '';
    $('#admPvNew').href = pvUrl();
    if (open && !pvF.getAttribute('src')) pvF.src = pvUrl();
  }
  function pvFit() {
    if (!pv.classList.contains('wide') || pv.classList.contains('adm-hide')) { pvF.style.transform = ''; pvF.style.height = ''; return; }
    var st = $('.adm-pv-stage', pv), w = st.clientWidth - 24, h = st.clientHeight - 24, k = Math.min(1, w / 1280);
    pvF.style.transform = 'scale(' + k + ')'; pvF.style.height = (h / k) + 'px';
  }
  window.addEventListener('resize', function () { pvPaint(); });
  function pvToggle(v) { pvS.open = v === undefined ? !pvS.open : v; pvSave(); pvPaint(); }
  // reload the preview so it shows fresh stock / prices / coupons (front end caches stock 60s)
  function pvRefresh() {
    if (!pvF.getAttribute('src')) return;
    try { pvF.contentWindow.sessionStorage.removeItem('yy_stock_v2'); pvF.contentWindow.location.reload(); } catch (e) { pvF.src = pvF.src; }
  }
  // 預覽某一頁（例如剛儲存的商品頁）；open=false 時只在預覽已打開的情況下切換
  function pvShow(page, open) {
    pvS.page = page; if (open) pvS.open = true; pvSave();
    try { sessionStorage.removeItem('yy_stock_v2'); } catch (e) { }
    if (pvS.open) pvF.src = pvUrl(); else pvF.removeAttribute('src');
    pvPaint();
  }
  $('#admPvBtn').addEventListener('click', function () { pvToggle(); });
  $('#admPvFab').addEventListener('click', function () { pvToggle(true); });
  $('#admPvClose').addEventListener('click', function () { pvToggle(false); });
  $('#admPvReload').addEventListener('click', pvRefresh);
  $('#admPvPage').addEventListener('change', function () { pvS.page = this.value; pvSave(); pvF.src = pvUrl(); pvPaint(); });
  $$('.adm-pv-mode').forEach(function (b) { b.addEventListener('click', function () { pvS.mode = b.dataset.m; pvSave(); pvPaint(); }); });
  // keep the dropdown in sync when browsing inside the preview
  pvF.addEventListener('load', function () {
    try { var u = pvF.contentWindow.location.href; $('#admPvNew').href = u; } catch (e) { }
  });
  window.__pvRefresh = pvRefresh;
  new MutationObserver(pvPaint).observe($('#admShell'), { attributes: true, attributeFilter: ['class'] });

  /* ---------- boot ---------- */
  if (!GAS) { $('#admLoginErr').textContent = '尚未連接後台：請先在 assets/yy-config.js 填入 gasUrl。'; }
  if (DEMO) {
    $('#admDemoNote').classList.remove('adm-hide');
    $('#admDemoReset').onclick = demoReset;
    $('#admMailsNav').classList.remove('adm-hide');
    $('#admSheet').classList.add('adm-hide');
  }
  if (localStorage.getItem(TK) && GAS) {
    showApp();
    if (!S.sheetUrl && !DEMO) api('admin_settings').then(function (j) { $('#admSheet').href = j.sheetUrl; }).catch(function () { });
  } else showLogin();
  pvPaint();
})();
</script>
</body>
</html>
